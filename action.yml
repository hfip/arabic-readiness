name: Arabic readiness
description: Score RTL layout, Arabic coverage and plural correctness, then comment on the pull request

branding:
  icon: globe
  color: green

inputs:
  token:
    description: Token used to post the comment, normally the GITHUB_TOKEN secret
    required: true
  paths:
    description: Source paths to scan for layout issues
    required: false
    default: "Sources"
  catalog-paths:
    description: Paths to scan for .xcstrings files (defaults to paths)
    required: false
    default: ""
  lang:
    description: Language to score coverage for
    required: false
    default: "ar"
  comment:
    description: Post or update a pull request comment
    required: false
    default: "true"
  min-score:
    description: Fail the job when the score is below this number (0 disables)
    required: false
    default: "0"
  rtl-lint-ref:
    description: Git ref of rtl-lint to install
    required: false
    default: "v1"
  xcstrings-audit-ref:
    description: Git ref of xcstrings-audit to install
    required: false
    default: "v0.1.1"

outputs:
  score:
    description: The computed readiness score (0-100)
    value: ${{ steps.score.outputs.score }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install the linters
      shell: bash
      run: |
        python -m pip install --quiet --disable-pip-version-check \
          "git+https://github.com/hfip/rtl-lint@${{ inputs.rtl-lint-ref }}" \
          "git+https://github.com/hfip/xcstrings-audit@${{ inputs.xcstrings-audit-ref }}"

    - name: Scan layout
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
      run: |
        # rtl-lint exits 1 when it finds issues; that is expected here.
        rtl-lint --format json --no-color $PATHS > rtl-lint.json || true
        if [ ! -s rtl-lint.json ]; then
          echo '{"files":0,"issues":[],"summary":{}}' > rtl-lint.json
        fi

    - name: Scan catalog
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
        CATALOG_PATHS: ${{ inputs.catalog-paths }}
      run: |
        target="${CATALOG_PATHS:-$PATHS}"
        xca --json $target > xcstrings.json 2>/dev/null || true
        if [ ! -s xcstrings.json ]; then
          echo '{}' > xcstrings.json
        fi

    - name: Score
      id: score
      shell: bash
      env:
        LANG_CODE: ${{ inputs.lang }}
        MIN_SCORE: ${{ inputs.min-score }}
      run: |
        set +e
        output=$(python "$GITHUB_ACTION_PATH/scripts/report.py" \
          --rtl rtl-lint.json \
          --catalog xcstrings.json \
          --lang "$LANG_CODE" \
          --min-score "$MIN_SCORE" \
          --output arabic-readiness.md \
          --summary "$GITHUB_STEP_SUMMARY")
        status=$?
        set -e
        echo "$output"
        score=$(sed -n 's/^arabic-readiness: \([0-9]*\)%.*/\1/p' <<< "$output")
        echo "score=${score:-0}" >> "$GITHUB_OUTPUT"
        exit $status

    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        body=$(cat arabic-readiness.md)
        repo="$GITHUB_REPOSITORY"
        existing=$(gh api "repos/$repo/issues/$PR_NUMBER/comments" \
          --jq '.[] | select(.body | startswith("<!-- arabic-readiness -->")) | .id' | head -n1)
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$repo/issues/comments/$existing" -f body="$body" >/dev/null
        else
          gh api -X POST "repos/$repo/issues/$PR_NUMBER/comments" -f body="$body" >/dev/null
        fi
